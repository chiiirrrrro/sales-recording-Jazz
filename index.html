<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喫茶用ハンディ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; padding: 15px; font-size: 16px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        
        /* 商品選択ボタン */
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .item-btn { background: #fff; border: 2px solid #ddd; padding: 15px 10px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s; }
        .item-btn.selected { background: #e3f2fd; border-color: #2196f3; color: #1e88e5; }
        .item-price { display: block; font-size: 13px; color: #777; font-weight: normal; margin-top: 4px; }
        
        /* 数量カウント */
        .qty-container { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .qty-btn { width: 50px; height: 50px; background: #f0f0f0; border: none; border-radius: 50%; font-size: 24px; font-weight: bold; cursor: pointer; }
        .qty-btn:active { background: #ddd; }
        #qty-display { font-size: 24px; font-weight: bold; width: 40px; text-align: center; }
        
        /* 支払い方法 */
        .pay-container { display: flex; gap: 10px; margin-bottom: 25px; }
        .pay-btn { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; background: white; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; }
        .pay-btn.selected { background: #e8f5e9; border-color: #4caf50; color: #2e7d32; }
        
        /* 計算表示 */
        .summary { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-size: 18px; border-left: 5px solid #ff9800; }
        .summary div { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .total-line { font-weight: bold; color: #e65100; font-size: 22px; border-top: 1px calc(#eee) dashed; padding-top: 5px; margin-top: 5px; }
        
        /* 送信ボタン */
        .submit-btn { width: 100%; padding: 16px; background: #2196f3; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 6px rgba(33, 150, 243, 0.3); }
        .submit-btn:disabled { background: #bbb; box-shadow: none; cursor: not-allowed; }
        .submit-btn:active { background: #1e88e5; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="container">
    <h2>喫茶用レジハンディ</h2>
    <p class='center'><a href="リンク先のURL">屋台用はこちら</a></p>
    
    <label>商品選択</label>
    <div class="item-grid" id="itemGrid"></div>
    
    <label>個数</label>
    <div class="qty-container">
        <button class="qty-btn" onclick="changeQty(-1)">-</button>
        <span id="qty-display">1</span>
        <button class="qty-btn" onclick="changeQty(1)">+</button>
    </div>
    
    <label>支払い方法</label>
    <div class="pay-container">
        <button class="pay-btn" id="pay-cash" onclick="selectPayment('現金')">現金</button>
        <button class="pay-btn" id="pay-paypay" onclick="selectPayment('PayPay')">PayPay</button>
    </div>
    
    <div class="summary">
        <div><span>単価:</span><span id="view-price">0円</span></div>
        <div class="total-line"><span>合計金額:</span><span id="view-subtotal">0円</span></div>
    </div>
    
    <button class="submit-btn" id="submitBtn" onclick="sendData()" disabled>注文を送信</button>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzJpCgb4qQJVtxv7EvSYZg4UrAphTbxLQTlfDmyd7dNQ1gerHUcNDG0kCqW0S0U-GSH/exec";
   
    let PRODUCTS = [];
    let selectedProduct = null;
    let quantity = 1;
    let selectedPayment = '';

    // ページ読み込み時にスプレッドシートから商品データを取得
    window.addEventListener('DOMContentLoaded', () => {
        const itemGrid = document.getElementById('itemGrid');
        itemGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#777;">商品データを読み込み中...</p>';

        fetch(GAS_URL)
            .then(response => response.json())
            .then(data => {
                PRODUCTS = data;
                itemGrid.innerHTML = ''; // 読み込み中テキストを消去
                
                // 取得したデータからボタンを動的に生成
                PRODUCTS.forEach(prod => {
                    const btn = document.createElement('button');
                    btn.className = 'item-btn';
                    btn.id = prod.id;
                    btn.innerHTML = `${prod.name}<span class="item-price">¥${prod.price}</span>`;
                    btn.onclick = () => selectProduct(prod);
                    itemGrid.appendChild(btn);
                });
            })
            .catch(err => {
                itemGrid.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:red;">データの読み込みに失敗しました</p>';
                console.error(err);
            });
    });

    // 商品選択ロジック
    function selectProduct(product) {
        PRODUCTS.forEach(p => document.getElementById(p.id).classList.remove('selected'));
        document.getElementById(product.id).classList.add('selected');
        selectedProduct = product;
        updateSummary();
    }

    // 個数変更
    function changeQty(val) {
        if (quantity + val < 1) return;
        quantity += val;
        document.getElementById('qty-display').innerText = quantity;
        updateSummary();
    }

    // 支払い方法選択
    function selectPayment(method) {
        document.getElementById('pay-cash').classList.remove('selected');
        document.getElementById('pay-paypay').classList.remove('selected');
        
        if(method === '現金') document.getElementById('pay-cash').classList.add('selected');
        if(method === 'PayPay') document.getElementById('pay-paypay').classList.add('selected');
        
        selectedPayment = method;
        checkValidity();
    }

    // 金額計算・表示更新
    function updateSummary() {
        if (!selectedProduct) return;
        const price = selectedProduct.price;
        const subtotal = price * quantity;
        
        document.getElementById('view-price').innerText = `¥${price}`;
        document.getElementById('view-subtotal').innerText = `¥${subtotal}`;
        checkValidity();
    }

    // 送信ボタンの有効・無効化チェック
    function checkValidity() {
        const btn = document.getElementById('submitBtn');
        if (selectedProduct && selectedPayment && quantity > 0) {
            btn.disabled = false;
        } else {
            btn.disabled = true;
        }
    }

    // GASへデータ送信
    function sendData() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "送信中...";

        const payload = {
            productName: selectedProduct.name,
            price: selectedProduct.price,
            quantity: quantity,
            subtotal: selectedProduct.price * quantity,
            paymentMethod: selectedPayment
        };
        
        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(response => response.text()) // GASからのレスポンスを待つ
        .then(text => {
            Swal.fire({
                icon: 'success',
                title: '送信完了！',
                text: 'ご注文をお受けしました。',
                confirmButtonColor: '#3085d6',
            });
            resetForm();
        })
        .catch(err => {
            Swal.fire({
                icon: 'error',
                title: 'エラー',
                text: 'エラーが発生しました。もう一度試してください。',
                confirmButtonColor: '#d33',
            });
            btn.disabled = false;
            btn.innerText = "注文を送信";
            console.error(err);
        });
    }

    
    // 送信後のフォームリセット
    function resetForm() {
        if(selectedProduct) document.getElementById(selectedProduct.id).classList.remove('selected');
        selectedProduct = null;
        quantity = 1;
        document.getElementById('qty-display').innerText = 1;
        document.getElementById('pay-cash').classList.remove('selected');
        document.getElementById('pay-paypay').classList.remove('selected');
        selectedPayment = '';
        document.getElementById('view-price').innerText = '0円';
        document.getElementById('view-subtotal').innerText = '0円';
        document.getElementById('submitBtn').innerText = "注文を送信";
        checkValidity();
    }
</script>

</body>
</html>
